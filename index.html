function settings(fromRace=false){fromRace=fromRace===true;if(fromRace){state='race';paused=true;coreShow(`<h2>SOUND CHECK.</h2>${settingsFields()}<div class="actions"><button class="primary" id="settings-resume">BACK TO PAUSE</button><button id="settings-exit">EXIT TO GARAGE</button></div>`);document.getElementById('settings-resume').onclick=pauseScreen;document.getElementById('settings-exit').onclick=abandonRace}else{state='settings';show(`<h2>SOUND CHECK.</h2>${settingsFields()}<label class="settings-label" for="player-name">PLAYER NAME</label><input id="player-name" maxlength="20" value="${escapeHTML(profile.name)}"><button id="save-player">SAVE NAME</button><p class="small">${profileStorage?'Your garage is saved on this browser.':'Storage unavailable: garage rewards last for this session.'}</p>`);document.getElementById('save-player').onclick=()=>{profile.name=cleanName(document.getElementById('player-name').value)||'NIGHT DRIVER';lastPlayerName=profile.name;saveProfile();persistBoards();uiSound('confirm');settings()}}document.getElementById('sound-volume').oninput=e=>{profile.volume=+e.target.value/100;setVolume();saveProfile();document.getElementById('volume-value').textContent=e.target.value+'%'};document.getElementById('sound-mute').onclick=()=>{profile.muted=!profile.muted;muted=profile.muted;setVolume();saveProfile();document.getElementById('sound-mute').textContent=profile.muted?'UNMUTE':'MUTE'};}

let noiseBuffer=null,musicTimer=null,musicStep=0,musicNext=0,fxNextMud=0,fxNextSlide=0,wasBoost=false;
function setVolume(){muted=!!profile?.muted;if(master)master.gain.value=muted?0:(profile?.volume??.7)*.35;const b=document.getElementById('mute');b.textContent=muted?'SOUND OFF':'SOUND ON';b.setAttribute('aria-pressed',muted)}
function engineVoice(){if(engine&&profile)engine.type=TRUCKS[profile.truck].wave;}
unlock=function(){coreUnlock();if(!audio)return;setVolume();engineVoice();if(!noiseBuffer){noiseBuffer=audio.createBuffer(1,audio.sampleRate,audio.sampleRate);const data=noiseBuffer.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=Math.random()*2-1}if(!musicTimer){musicNext=audio.currentTime;musicTimer=setInterval(musicTick,100)}};
function tone(freq,duration=.12,wave='sine',vol=.18,when=0,end=freq*.8){if(!audio)return;const at=when||audio.currentTime,o=audio.createOscillator(),g=audio.createGain();o.type=wave;o.frequency.setValueAtTime(freq,at);o.frequency.exponentialRampToValueAtTime(Math.max(20,end),at+duration);g.gain.setValueAtTime(.001,at);g.gain.linearRampToValueAtTime(vol,at+.008);g.gain.exponentialRampToValueAtTime(.001,at+duration);o.connect(g);g.connect(master);o.start(at);o.stop(at+duration+.01)}
function noise(duration=.12,freq=800,vol=.15){if(!audio||!noiseBuffer)return;const s=audio.createBufferSource(),f=audio.createBiquadFilter(),g=audio.createGain();s.buffer=noiseBuffer;f.type='lowpass';f.frequency.value=freq;g.gain.setValueAtTime(vol,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);s.connect(f);f.connect(g);g.connect(master);s.start();s.stop(audio.currentTime+duration)}
function uiSound(kind='tap'){unlock();tone(kind==='confirm'?740:kind==='swipe'?360:480,.09,'triangle',.10)}
function rev(){unlock();const t=TRUCKS[profile.truck];tone(t.base*2,.28,t.wave,.2,0,t.base*7);tone(t.base*6,.24,t.wave,.13,audio?audio.currentTime+.23:0,t.base*2)}

function stinger(kind){if(!audio)return;const notes=kind==='win'?[392,523.25,659.25,1046.5]:kind==='lose'?[220,196,164.81]:kind==='epic'?[523.25,659.25,783.99,1046.5,1567.98]:kind==='rare'?[392,523.25,783.99]:[329.63,440,659.25];notes.forEach((n,i)=>tone(n,.22,'triangle',.17,audio.currentTime+i*.10,n))}
function coinTally(amount){if(!audio)return;const n=Math.min(16,Math.max(3,Math.floor(amount/50)));for(let i=0;i<n;i++)tone(1000+i*45,.055,'sine',.09,audio.currentTime+i*.045,800+i*35)}
function musicTick(){if(!audio||muted||audio.state!=='running'||document.hidden||orientationBlocked)return;if(state==='race'&&(paused||orientationBlocked))return;const driving=state==='race',stepTime=driving?.19:.26;if(musicNext<audio.currentTime-.2)musicNext=audio.currentTime;while(musicNext<audio.currentTime+.16){const bass=[65.41,65.41,82.41,73.42,65.41,98,87.31,73.42],lead=[523.25,0,659.25,587.33,0,783.99,659.25,0,523.25,659.25,0,440,493.88,0,392,0],n=musicStep++%16;tone(bass[Math.floor(n/2)],stepTime*.7,driving?'sawtooth':'triangle',driving?.055:.045,musicNext,bass[Math.floor(n/2)]);if(lead[n])tone(lead[n]*(driving?.5:1),stepTime*.55,'sine',.035,musicNext,lead[n]*(driving?.5:1));if(driving&&n%4===0)tone(90,.08,'sine',.08,musicNext,35);musicNext+=stepTime}}
beep=function(freq=400,duration=.12,type='sine',volume=.3){coreBeep(freq,duration,type,volume);if(freq===75||freq===85)noise(.16,230,.22);};
advanceLap=function(t,x,y){const lap=t.lap,check=t.check;coreAdvanceLap(t,x,y);if(!t.id&&audio){if(t.check!==check&&t.lap===lap)tone(900,.08,'sine',.08);if(t.lap===3&&lap===2){[330,440,660].forEach((n,i)=>tone(n,.18,'square',.12,audio.currentTime+i*.13,n))}}};
update=function(){coreUpdate();if(!audio||state!=='race'||paused||countdown>0)return;const t=trucks[0],v=TRUCKS[profile.truck],speed=Math.hypot(t.vx,t.vy);engine.frequency.value=v.base+speed*v.ratio;if(t.boost&&!wasBoost)noise(.38,2500,.24);wasBoost=t.boost;const ground=surface(t.x,t.y);if(ground==='mud'&&speed>35&&elapsed>=fxNextMud){noise(.14,450,.14);fxNextMud=elapsed+.4}const slide=Math.abs(-t.vx*Math.sin(t.a)+t.vy*Math.cos(t.a));if(slide>36&&speed>70&&elapsed>=fxNextSlide){tone(680+slide*2,.13,'sawtooth',.055);fxNextSlide=elapsed+.28}};

function podiumHTML(entries,board=false){return `<div class="podium-v2">${[1,0,2].map(i=>{const r=entries[i],id=r?.name==='YOU'?profile.truck:(r?.truck??i%4);return `<div class="podium-place place-${i+1}"><div class="podium-truck ${i===0?'celebrate':''}">${faceIcon(id,r?.name==='YOU'?profile.skins[profile.truck]:-1)}</div><div class="podium-block"><b>${i===0?'♛':i+1}</b><strong>${r?escapeHTML(r.name):'OPEN SPOT'}</strong><span>${r?.time!=null?formatTime(r.time):board?'SET A TIME':'STILL RACING'}</span></div></div>`}).join('')}</div>`}
renderResults=function(){state='results';const pos=result.find(r=>r.name==='YOU').pos,r=raceReceipt||{base:T.PRIZES[pos-1],bonus:0,gift:0,crates:0},player=result.find(r=>r.name==='YOU');show(`<div class="results-v2"><header class="screen-title"><h2>${pos===1?'VICTORY!':'WHAT A RIDE!'}</h2><p>${escapeHTML(track.name)} · ROUND ${stats.races}/8${result.some(v=>v.name!=='YOU'&&v.time!=null&&Math.abs(v.time-player.time)<.5)?' · PHOTO FINISH!':''}</p></header>${podiumHTML(result)}<div class="result-strip"><div><span>FINISH TIME</span><b>${formatTime(player.time||elapsed)}</b></div><div><span>PLACE ${pos}/4 ${resultNewBest?'· NEW BEST!':''}</span><b class="result-stars">${'★'.repeat(Math.max(0,4-pos))}${'☆'.repeat(pos-1)}</b></div><div><span>${r.bonus?'FIRST WIN ×2':'RACE PAYOUT'}${r.gift?' + SEASON GIFT':''}</span><b class="payout">● +<em data-count="${r.base+r.bonus+r.gift}">${r.base+r.bonus+r.gift}</em></b></div></div><div class="results-bottom">${r.crates?`<button class="earned-crate" id="results-crate">▣ <span>CRATE EARNED<b>+${r.crates} MYSTERY CRATE${r.crates>1?'S':''}</b></span> →</button>`:'<span class="result-note">Every podium brings a crate.</span>'}<div class="result-actions"><button id="results-garage">GARAGE</button><button id="results-board">TOP BOARD</button><button id="continue">${seasonComplete()?'SUMMARY':'UPGRADES'}</button><button class="primary" id="race-again">RACE AGAIN →</button></div></div><div class="celebration-v2" aria-hidden="true">${Array.from({length:24},(_,i)=>`<i style="--i:${i};--color:${i%3?'#2ee6c8':'#ff8a2a'}"></i>`).join('')}</div></div>`);document.getElementById('continue').onclick=()=>seasonComplete()?summary():shop();document.getElementById('results-board').onclick=()=>showBoard(race,'results');document.getElementById('results-garage').onclick=garage;document.getElementById('race-again').onclick=()=>{profile.track=race;beginRace()};const b=document.getElementById('results-crate');if(b)b.onclick=openCrate;countNumbers()};
showBoard=function(index,origin='garage'){state='board';const list=boards[index];show(`<div class="board-v2"><header class="screen-title"><h2>♛ TOP BOARD</h2><p>FOUR LAPS. ONE PERFECT RUN.</p></header><nav class="track-chips">${TRACKS.map((t,i)=>`<button data-track="${i}" aria-pressed="${i===index}">${i+1}<span>${escapeHTML(t.name.replace(' / Mirror',' ↔').replace(' / Finale',''))}</span></button>`).join('')}</nav>${podiumHTML(list,true)}<div class="ranked-rows">${list.length?list.map((r,i)=>`<div class="rank-row ${r.name===lastPlayerName||r.name===profile.name||r.name==='YOU'?'player-row':''}"><b>${i+1}</b><strong>${escapeHTML(r.name)}</strong><span class="truck-dot" style="background:${TRUCKS[(r.truck??i)%4].skins[0][1]}"></span><span class="board-time">${formatTime(r.time)}</span><span class="skill-badge">${AI_SKILLS[r.skill]?.name||'Rookie'}</span></div>`).join(''):'<p class="empty-board-v2">No times yet. Your first finish starts the board.</p>'}</div><footer class="board-footer"><span>${storageAvailable?'RECORDS SAVED ON THIS BROWSER':'STORAGE UNAVAILABLE · SESSION ONLY'}</span><div><button id="board-back">${origin==='results'?'RESULTS':'GARAGE'}</button>${origin==='results'?'<button id="board-garage">GARAGE</button>':''}<button class="primary" id="board-race">RACE →</button></div></footer></div>`);document.querySelectorAll('[data-track]').forEach(b=>b.onclick=()=>showBoard(+b.dataset.track,origin));document.getElementById('board-back').onclick=()=>origin==='results'?renderResults():garage();const home=document.getElementById('board-garage');if(home)home.onclick=garage;document.getElementById('board-race').onclick=()=>{profile.track=index;beginRace()}};
crateScreen=function(){state='crate';const c=profile.activeCrate,n=['COMMON','RARE','EPIC'];show(`<div class="crate-v2 rarity-${c.rarity}"><header class="screen-title"><h2>MYSTERY CRATE</h2>${coinPill()}</header><p class="crate-instruction">FOUR TAPS. TURN THE NIGHT UP.</p><div class="crate-platform"><div class="tech-ring"></div><button id="crate-tap" class="crate-box tap-${c.tap}" aria-label="Crate tap ${c.tap+1} of four"><span class="crate-lid"></span><span class="crate-ribbon"></span><b>?</b></button></div><div class="tap-dots">${[0,1,2,3].map(i=>`<i class="${i<c.tap?'lit':''}"></i>`).join('')}</div><strong class="crate-rarity">${n[c.rarity]}</strong><div class="rarity-path">${n.map((v,i)=>`<span class="${i<=c.rarity?'lit':''}">${v}</span>`).join('')}</div><p class="crate-help">${4-c.tap} TAPS TO REVEAL · TAP THE CRATE</p></div>`);document.getElementById('crate-tap').onclick=tapCrate};
revealCrate=function(p){state='reveal';show(`<div class="crate-v2 crate-reveal rarity-${p.rarity}"><header class="screen-title"><h2>${['COMMON','RARE','EPIC'][p.rarity]} REVEAL</h2>${coinPill()}</header><div class="prize-card"><div class="prize-symbol">${p.kind==='livery'?faceIcon(p.truck,p.skin):p.kind==='cash'?'●':'⚙'}</div><h3>${escapeHTML(p.title)}</h3><p>${escapeHTML(p.detail)}</p></div><div class="actions"><button class="primary" id="reveal-home">GARAGE →</button>${profile.crates?'<button id="another-crate">OPEN ANOTHER</button>':''}</div></div>`);document.getElementById('reveal-home').onclick=garage;const b=document.getElementById('another-crate');if(b)b.onclick=openCrate;countNumbers()};
// HUD is native text for crisp readable phone typography, updated at 10 Hz.
let hudRoot=null;
function mountRaceHud(){if(!hudRoot){hudRoot=document.getElementById('race-hud')}hudRoot.dataset.order='';hudRoot.innerHTML=`<div class="hud-left"><div class="hud-pill"><small>POSITION</small><b id="hud-position">1 / 4</b></div><div class="hud-pill"><small>LAP</small><b id="hud-lap">1 / 4</b></div></div><div class="hud-time"><div class="timer-pill"><small>RACE TIME</small><b id="hud-time">0:00.0</b></div><div class="best-pill"><small>BEST <span id="hud-best-name"></span></small><b id="hud-best">--:--.---</b><span id="hud-delta">AT NEXT LAP</span></div></div><div class="event-slot" id="event-slot"></div><div class="live-order" id="live-order"></div><div class="race-bottom-pill"><span id="hud-track"></span><b id="hud-speed"></b><span id="hud-cash"></span></div><div class="comeback-pill" id="comeback-label"></div>`;lastHud=-1}
function hudElement(id,text){const e=document.getElementById(id);if(e)e.textContent=text}
paintHud=function(){hud.clearRect(0,0,960,720)};
function updateRaceHud(){if(!hudRoot||state!=='race'||elapsed-lastHud<.1&&countdown<=0)return;lastHud=elapsed;const t=trucks[0],order=standings(),rank=order.findIndex(v=>v.id===0)+1;hudElement('hud-position',rank+' / 4');hudElement('hud-lap',Math.min(t.lap+1,4)+' / 4');hudElement('hud-time',formatTime(t.finished?t.time:elapsed).slice(0,-2));hudElement('hud-best',raceBest?formatTime(raceBest.time):'--:--.---');hudElement('hud-best-name',raceBest?raceBest.name:'NO RECORD');hudElement('hud-delta',lapDelta===null?'AT NEXT LAP':(lapDelta>=0?'+':'')+lapDelta.toFixed(1)+'s '+(deltaEstimated?'EST. PACE':'LAP DELTA'));hudElement('hud-track',(stats.races+1)+'/8 · '+track.name);hudElement('hud-speed',Math.round(Math.hypot(t.vx,t.vy)*.48)+' km/h');hudElement('hud-cash','$'+cash);const stamp=order.map(v=>v.id+':'+v.finished).join();if(hudRoot.dataset.order!==stamp){hudRoot.dataset.order=stamp;document.getElementById('live-order').innerHTML=order.map((v,i)=>`<div class="order-rival ${v.id===0?'you':''}"><b>${i+1}</b>${faceIcon(v.id===0?profile.truck:v.id)}<span>${v.id===0?'YOU':v.name}</span></div>`).join('')}hudElement('event-slot',elapsed<calloutUntil?callout:'');hudElement('comeback-label',comebackReady?'COMEBACK NITRO READY':comebackCharge>0?'COMEBACK NITRO CHARGING '+Math.floor(comebackCharge/4*100)+'%':'')}
function banner(message,duration=2){callout=message;calloutUntil=elapsed+duration;lastHud=-1}
startRace=function(){priorBest=boards[race][0]?.time??Infinity;resultNewBest=false;v2Start();shake=0;feelTick=0;comebackCharge=0;comebackReady=false;lastRank=4;finalLapRank=4;lastPlayerLap=0;oilCursor=0;for(const d of oilDrops)d.life=0;for(const t of trucks){t.shield=0;t.feelAir=0;t.feelSpeed=0;t.feelNitro=t.nitro}for(const p of pickups){const n=nearest(p.x,p.y),v=at(n.s),side=track.width*.24*(p.kind==='N'?1:-1);p.x=v.x-Math.sin(v.angle)*side;p.y=v.y+Math.cos(v.angle)*side;p.kind=p.kind==='N'?'N':'?';p.timer=0}mountRaceHud();banner(Math.random()<.5?['REED: TRY TO KEEP UP!','FLINT: SEE YOU AT THE LINE!','MOSS: NICE PAINT. LET’S RACE.'][race%3]:'OWN THE NIGHT.',3);updateRaceHud();document.getElementById('race-menu').innerHTML='<span class="pause-bars" aria-hidden="true"></span>';document.getElementById('race-menu').setAttribute('aria-label','Pause / EXIT to garage')};
advanceLap=function(t,x,y){const lap=t.lap;v2Lap(t,x,y);if(t.id||t.lap===lap)return;for(const p of pickups)p.timer=0;if(t.lap===3){finalLapRank=standings().findIndex(v=>v.id===0)+1;banner('LAST LAP!',3)}if(t.finished){resultNewBest=t.time<priorBest;const other=trucks.find(v=>v.id&&v.finished&&Math.abs(v.time-t.time)<.5);if(other)banner('PHOTO FINISH!',4)}};
function collectArcadePickup(t,p,cap){p.timer=99999;if(p.kind==='N')t.nitro=cap;else{if(!t.id)reward(T.CASH);const roll=Math.random();if(roll<.34){t.nitro=Math.min(cap,t.nitro+.9);t.padTimer=Math.max(t.padTimer,.45);notice(t,'BOOST CAN!')}else if(roll<.67){t.shield=3;notice(t,'SHIELD!')}else{const d=oilDrops[oilCursor++%oilDrops.length];d.x=t.x-Math.cos(t.a)*32;d.y=t.y-Math.sin(t.a)*32;d.life=4;notice(t,'OIL DROP!')}}burst(p.x,p.y,p.kind==='N'?V2.teal:V2.orange,16);if(!t.id)beep(p.kind==='N'?750:1000,.12,'sine')}
funStep=function(t,surf,speed){v2Fun(t,t.shield>0&&surf==='oil'?'track':surf,speed);t.shield=Math.max(0,(t.shield||0)-T.DT);if(t.shield<=0&&t.air<=0&&t.oilCooldown===0)for(const d of oilDrops)if(d.life>0&&Math.hypot(t.x-d.x,t.y-d.y)<15){t.spin=T.OIL_TIME;t.spinRate=(t.id%2?1:-1)*4.6;t.oilCooldown=T.OIL_COOLDOWN;notice(t,'OIL!');break}};
beep=function(f=400,d=.12,type='sine',v=.3){v2Beep(f,d,type,v);if(f===75||f===85)shake=Math.max(shake,3);if(f===260)noise(.13,800,.2);if(f===740){shake=Math.max(shake,2);noise(.12,350,.18)}};
update=function(){if(state!=='race'||paused||orientationBlocked)return;const before=elapsed;v2Update();if(elapsed===before)return;shake*=.84;feelTick++;for(const d of oilDrops)d.life=Math.max(0,d.life-T.DT);for(const t of trucks){const speed=Math.hypot(t.vx,t.vy),lat=Math.abs(-t.vx*Math.sin(t.a)+t.vy*Math.cos(t.a));if(t.feelAir>0&&t.air===0){burst(t.x,t.y,'#d6b999',18);if(!t.id)shake=Math.max(shake,2)}t.feelAir=t.air;if(!t.air&&speed>50&&feelTick%3===t.id%3){const fx=Math.cos(t.a),fy=Math.sin(t.a),drift=lat>30;for(const side of FEEL_SIDES)emitParticle(t.x-fx*17-fy*side*10,t.y-fy*17+fx*side*10,-t.vx*.12,-t.vy*.12,drift?.8:.5,drift?'#b8bacc':'#a99578',drift?5:3)}t.feelSpeed=speed;if(!t.id&&lat>35&&feelTick%16===0)noise(.12,1200,.11)}if(state==='race'&&countdown<=0){const order=standings(),rank=order.findIndex(v=>v.id===0)+1,t=trucks[0];if(t.lap===3&&finalLapRank-rank>=2){banner('COMEBACK!',2.5);finalLapRank=rank}lastRank=rank;const ahead=order[2];if(rank===4&&ahead&&ahead.total-t.total>length*.12&&!comebackReady){comebackCharge=Math.min(4,comebackCharge+T.DT);if(comebackCharge>=4){t.nitro=Math.min(T.NITRO+levels[3]*.8,t.nitro+.7);comebackReady=true;banner('COMEBACK NITRO READY!',2)}}else if(rank<4){comebackCharge=0;comebackReady=false}}updateRaceHud()};
// Dynamic strokes and cached sprites only. The full static scenery stays baked.
const v2DrawTruck=drawTruck;
drawTruck=function(t){v2DrawTruck(t);if(t.shield>0){ctx.strokeStyle='#87f9f1aa';ctx.lineWidth=2;ctx.beginPath();ctx.arc(t.x,t.y,30,0,Math.PI*2);ctx.stroke()}};
function drawFeel(){for(const d of oilDrops)if(d.life>0){ctx.globalAlpha=Math.min(1,d.life);ctx.fillStyle='#0a102b';ctx.beginPath();ctx.ellipse(d.x,d.y,17,10,0,0,7);ctx.fill();ctx.strokeStyle='#b98bf8';ctx.lineWidth=1;ctx.stroke()}ctx.globalAlpha=1;const t=trucks[0];if(t&&(t.boost||t.feelSpeed>T.TOP*.92)){ctx.strokeStyle=t.boost?'#91fff0aa':'#e3f4ff66';ctx.lineWidth=1.5;for(let i=0;i<8;i++){const a=t.a+(i%2?1:-1)*(.15+(i%4)*.18),r=35+(clock*130+i*23)%100,x=t.x-Math.cos(a)*r,y=t.y-Math.sin(a)*r;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-Math.cos(t.a)*15,y-Math.sin(t.a)*15);ctx.stroke()}}}
function drawStartLights(){if(countdown<=0)return;const lit=3-Math.ceil(countdown);ctx.fillStyle='#14223fee';ctx.beginPath();ctx.roundRect(356,265,248,100,22);ctx.fill();ctx.strokeStyle=V2.teal;ctx.lineWidth=2;ctx.stroke();for(let i=0;i<3;i++){ctx.fillStyle=i<=lit?V2.orange:'#34476a';ctx.beginPath();ctx.arc(408+i*72,311,22,0,7);ctx.fill();ctx.fillStyle='#ffffff55';ctx.beginPath();ctx.arc(402+i*72,304,7,0,7);ctx.fill()}text('READY • SET • RUT',480,350,14,'#e9ffff','center')}
const arcadePickups=['N','?'].map((kind,i)=>{const c=document.createElement('canvas');c.width=c.height=80;const g=c.getContext('2d');g.translate(40,40);g.fillStyle='#06142b66';g.beginPath();g.ellipse(3,24,27,8,0,0,7);g.fill();g.fillStyle=i?'#ff8a2a':'#2ee6c8';g.strokeStyle='#cafff4';g.lineWidth=3;g.beginPath();g.roundRect(-22,-24,44,49,i?8:12);g.fill();g.stroke();g.fillStyle='#e7fff6';if(!i){g.fillRect(-7,-31,14,8);g.fillStyle='#153854';g.beginPath();g.moveTo(6,-19);g.lineTo(-10,3);g.lineTo(0,3);g.lineTo(-4,17);g.lineTo(13,-5);g.lineTo(3,-5);g.closePath();g.fill()}else{g.fillStyle='#1a2d53';g.fillRect(-4,-24,8,49);g.fillRect(-22,-13,44,7);g.fillStyle='#fff0d8';g.font='bold 27px Arial';g.textAlign='center';g.fillText('?',0,13)}return c});

// Fixed 1/60 physics with bounded catch-up; don't redraw static menus or portrait.
let previous=0,accumulator=0,lastDraw=0;
function frame(ms){const delta=previous?Math.min((ms-previous)/1000,T.DT*T.MAX_CATCHUP):0;previous=ms;
 if(state==='race'&&!paused&&!orientationBlocked){accumulator+=delta;while(accumulator>=T.DT){update();accumulator-=T.DT}needsRender=true}else accumulator=0;
 if(!orientationBlocked&&needsRender&&ms-lastDraw>=1000/60-1){render();lastDraw=ms;needsRender=false}requestAnimationFrame(frame)}
// Decode all embedded artwork before exposing the title/Start button. Retain the
// decoded images so the CSS title backdrop is already warm on a phone's first tap.
const embeddedArtwork=[];
async function boot(){try{const css=document.querySelector('style').textContent;for(const match of css.matchAll(/url\(["']?(data:image\/[^"')]+)["']?\)/g)){const img=new Image();img.decoding='async';img.src=match[1];embeddedArtwork.push(img);if(img.decode)await img.decode();else await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject})}}catch(e){/* Procedural track and all controls remain usable if decorative art fails. */}
 garageArt=embeddedArtwork[0]||null;sheetImage=embeddedArtwork[1]||null;loadProfile();resizeView();ready=true;garage();requestAnimationFrame(frame)}
boot();
</script></body></html>
