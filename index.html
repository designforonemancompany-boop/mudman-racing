/* RUT identity: printed rally posters, cut-corner instruments, team liveries. */
:root{--ink:#263238;--bone:#F3F1E8;--orange:#FF6A00;--sage:#b1ba9d}
html,body{background:#151a18;color:var(--bone)}
#frame{box-shadow:0 24px 100px #0009;border:1px solid #495045}
#overlay{background:linear-gradient(115deg,#263238fa,#263238ed);padding:6% 8%}
.panel{max-width:740px;position:relative}h1{font-family:Impact,'Arial Black',sans-serif;font-size:clamp(80px,16vw,178px);line-height:.9;letter-spacing:-7px;color:var(--bone);text-shadow:5px 5px 0 #FF6A00;transform:skew(-7deg);margin:0 0 27px}

function frame(ms){const delta=previous?Math.min((ms-previous)/1000,T.DT*T.MAX_CATCHUP):0;previous=ms;
 if(state==='race'&&!paused&&!orientationBlocked){accumulator+=delta;while(accumulator>=T.DT){update();accumulator-=T.DT}needsRender=true}else accumulator=0;
 if(!orientationBlocked&&needsRender&&ms-lastDraw>=1000/60-1){render();lastDraw=ms;needsRender=false}requestAnimationFrame(frame)}
// Decode all embedded artwork before exposing the title/Start button. Retain the
// decoded images so the CSS title backdrop is already warm on a phone's first tap.
const embeddedArtwork=[];
async function boot(){try{const css=document.querySelector('style').textContent;for(const match of css.matchAll(/url\(["']?(data:image\/[^"')]+)["']?\)/g)){const img=new Image();img.decoding='async';img.src=match[1];embeddedArtwork.push(img);if(img.decode)await img.decode();else await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject})}}catch(e){/* Procedural track and all controls remain usable if decorative art fails. */}
 resizeView();ready=true;title();requestAnimationFrame(frame)}
boot();
